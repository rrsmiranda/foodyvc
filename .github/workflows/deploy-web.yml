name: Deploy demo web (GitHub Pages)

# Publica a DEMO (lib/main_demo.dart, com o mock do M4) em
# https://rrsmiranda.github.io/foodyvc/ a cada push na main.
#
# Pre-requisito (1x, manual): repo -> Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: >
          flutter build web --release
          -t lib/main_demo.dart
          --base-href /foodyvc/
          --no-tree-shake-icons
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
